name = "selene-report"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
REPO = "mattxslv/Selene"

# rate limits; the id comes from `npx wrangler kv namespace create LIMITS`
[[kv_namespaces]]
binding = "LIMITS"
id = "REPLACE_WITH_KV_ID"

# GITHUB_TOKEN is a secret: `npx wrangler secret put GITHUB_TOKEN` (never in this file)
