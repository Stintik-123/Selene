name = "selene-report"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
REPO = "mattxslv/Selene"

# rate limits; the id comes from `npx wrangler kv namespace create LIMITS`
[[kv_namespaces]]
binding = "LIMITS"
id = "8ca34546671d4ac9a371a5d324bc4496"

# secrets (never in this file): APP_ID and APP_PRIVATE_KEY (GitHub App, PKCS#8 PEM), so issues come from "<app>[bot]";
# `npx wrangler secret put APP_ID` / `npx wrangler secret put APP_PRIVATE_KEY`. GITHUB_TOKEN (personal) is the fallback.

# pictures in reports and drafts finished on a phone
[[kv_namespaces]]
binding = "STORE"
id = "8b8bfa5d43ef41ba8a0ecf3908222fb1"
