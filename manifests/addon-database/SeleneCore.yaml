Type: Generic
Name: 'Selene Core'
Author: 'Matthew Silva'
ShortDescription: 'The companion add-on of the Selene fullscreen theme: profiles, the Store page, captures, Activity, the loading screen and Selene settings. Does nothing without the theme.'
Description: |
    Selene Core only works while the Selene fullscreen theme is in use. It adds what a theme alone can't: Who's playing? profiles with their own avatar, theme and wallpaper; the Store page with free games, sales and new releases; your screenshots and clips from Steam, Xbox Game Bar and the NVIDIA app; Activity; Surprise me; a loading screen with the game's art that waits until the game is really on screen; Playnite's settings, dialogs and menus in Selene's look; and Selene settings, where every one of these can be switched off.
