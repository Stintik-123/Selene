name: Bug report
description: Something in Selene doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. The details below make it much faster to fix.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead. Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      placeholder: |
        1. Open Playnite in fullscreen
        2. Select a game on the home row
        3. Press Play
    validations:
      required: true
  - type: input
    id: selene
    attributes:
      label: Selene version
      description: Fullscreen mode, Menu > Settings > Appearance > Theme, or the file name you downloaded.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: playnite
    attributes:
      label: Playnite version
      description: Menu > About (or Help > About in desktop mode).
      placeholder: "10.63"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other (please say in the description)
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: What are you using to control Playnite?
      options:
        - Xbox controller
        - Other controller
        - Keyboard and mouse
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Drag the log files here if you can:
        - Playnite: `%AppData%\Playnite\playnite.log` (portable installs: `playnite.log` in the Playnite folder)
        - Selene Core: `%TEMP%\selene.log`
        Paste `%AppData%` or `%TEMP%` into the File Explorer address bar to open those folders.
